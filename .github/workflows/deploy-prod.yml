name: CI/CD - Build, DB Sync & Deploy to Vercel Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'desktop-agent/**'
      - 'vscode-extension/**'
      - '**/*.md'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/vscode-publish.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'desktop-agent/**'
      - 'vscode-extension/**'
      - '**/*.md'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/vscode-publish.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    name: Test, DB Sync & Deploy (Single Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & domain tests
        run: npm test

      - name: Typecheck & production build
        run: npm run build

      - name: Sync Prisma schema & RLS guards
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::notice::DIRECT_URL secret is not set; skipping automatic DB schema & guards sync."
            exit 0
          fi
          npx prisma db push
          npm run db:guards

      - name: Deploy to Vercel Production
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
