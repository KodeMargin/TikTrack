name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'macOS Apple Silicon (ARM64)'
            platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - name: 'macOS Intel (x86_64)'
            platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - name: 'Windows (x86_64)'
            platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - name: 'Linux (Ubuntu)'
            platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libssl-dev libxdo-dev

      - name: Install desktop-agent dependencies
        run: |
          cd desktop-agent
          npm install

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: './desktop-agent'
          owner: 'KodeMargin'
          repo: 'TikTrack-Release'
          releaseCommitish: 'main'
          tagName: ${{ inputs.version || github.ref_name || 'v0.2.0' }}
          releaseName: "TikTrack Desktop Agent ${{ inputs.version || github.ref_name || 'v0.2.0' }}"
          releaseBody: "Production release of TikTrack Desktop Agent for macOS (Apple Silicon & Intel), Windows, and Linux."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
